name: Build & Release PiMet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 生成版本号与文件名
        id: ver
        run: |
          GRADLE_VER=$(grep -E 'versionName' app/build.gradle | head -1 | sed 's/.*versionName *"//; s/".*//')
          if [ -z "$GRADLE_VER" ]; then echo "versionName 解析失败"; exit 1; fi
          TAG="v${GRADLE_VER}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Publishing $TAG"
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/PiMet-$TAG.apk"
          ls -la app/build/outputs/apk/release/

      - name: 发布为新版本
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: PiMet ${{ steps.ver.outputs.tag }}
          body: |
            PiMet - Pi-Web 与原生终端控制台 (完全本地运行，不依赖外部 App)
            自动构建 #${{ github.run_number }}
            提交：${{ github.sha }}
          files: app/build/outputs/apk/release/PiMet-*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiMet-release
          path: app/build/outputs/apk/release/PiMet-*.apk
          if-no-files-found: error
